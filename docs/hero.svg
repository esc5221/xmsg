<path d="M32 498 a10 10 0 0 1 10 -10 h1196 a10 10 0 0 1 10 10 v18 h-1216 z" fill="#26282e"/>
<circle cx="50" cy="502" r="5.5" fill="#ff5f57"/>
<circle cx="68" cy="502" r="5.5" fill="#febc2e"/>
<circle cx="86" cy="502" r="5.5" fill="#28c840"/>
<text x="596.8" y="507" font-size="12" xml:space="preserve"><tspan fill="#7d828c">laptop — zsh</tspan></text>
<text x="48" y="542" font-size="13" xml:space="preserve"><tspan fill="#5fbf6f">~ </tspan><tspan fill="#7aa2f7">❯ </tspan><tspan fill="#d4d7dd">xmsg log -n 2</tspan></text>
<text x="48" y="561" font-size="13" xml:space="preserve"><tspan fill="#7d828c">ID        AGE  FROM                    TO                      STATUS     VIA</tspan></text>
<text x="48" y="580" font-size="13" xml:space="preserve"><tspan fill="#d8b45c">8b2e44d1</tspan><tspan fill="#d4d7dd">  41s  desktop/claude:review   laptop/codex:build      </tspan><tspan fill="#5fbf6f">delivered</tspan><tspan fill="#7d828c">  codex:steer</tspan></text>
<text x="48" y="599" font-size="13" xml:space="preserve"><tspan fill="#d8b45c">3f9a1c20</tspan><tspan fill="#d4d7dd">  58s  laptop/codex:build      desktop/claude:review   </tspan><tspan fill="#5fbf6f">delivered</tspan><tspan fill="#7d828c">  peer:desktop</tspan></text></svg>
